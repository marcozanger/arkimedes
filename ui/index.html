<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="ark-token" content="{{ARK_TOKEN}}">
<title>Arkimedes</title>
<style>
:root {
  --bg: #f8fafc; --raised: #ffffff; --line: #d3dbe5; --fg: #17212e; --muted: #5a6979;
  --accent: #1f55c4; --accent-soft: #dfe8fa; --attn: #b56d00; --attn-soft: #fbeed5; --attn-ink: #8a5200;
  --bad: #b3261e; --bad-soft: #fae3e1; --ok: #17693f; --ok-soft: #dcf0e4; --wait: #5d6b7b; --wait-soft: #e6ebf1; --grid: #e3e9f0;
  --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, Menlo, monospace;
  --shadow: 0 6px 24px rgba(23, 33, 46, .14);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #171e28; --raised: #1f2835; --line: #313d4d; --fg: #e7ecf2; --muted: #9aa8b8;
  --accent: #86aaf5; --accent-soft: #24355a; --attn: #f0b95c; --attn-soft: #413016; --attn-ink: #f0b95c;
  --bad: #f29b94; --bad-soft: #4a2220; --ok: #79d2a0; --ok-soft: #1c3b2a; --wait: #a3b0bf; --wait-soft: #2a3442; --grid: #263140;
  --shadow: 0 6px 24px rgba(0, 0, 0, .45);
  color-scheme: dark;
} }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
h1, h2, h3 { margin: 0; }
.mono { font-family: var(--mono); font-size: .92em; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
#banner { padding: 8px 14px; background: var(--attn-soft); color: var(--attn-ink); border-bottom: 1px solid var(--attn); font-size: 13px; }
#banner.bad { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }

/* shell */
.app { display: grid; grid-template-columns: 210px minmax(0, 1fr); min-height: 100vh; }
.menu { border-right: 1px solid var(--line); background: var(--raised); padding: 14px 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; position: sticky; top: 0; height: 100vh; }
.brand { font-weight: 700; font-size: 15px; padding: 0 8px 10px; }
.nav { display: block; padding: 7px 8px; border-radius: 6px; color: var(--fg); text-decoration: none; font-weight: 500; }
.nav:hover { background: var(--wait-soft); }
.nav[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav .count { float: right; font: 500 11.5px var(--mono); color: var(--attn-ink); }
.foot { margin-top: auto; display: grid; gap: 4px; padding: 10px 8px 0; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; vertical-align: 1px; }
.dot.off { background: var(--bad); }
.dot.warn { background: var(--attn-ink); }
.main { padding: 18px 22px 96px; display: grid; gap: 16px; align-content: start; min-width: 0; }
.screen-head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; justify-content: space-between; }
.screen-head h1 { font-size: 20px; font-weight: 650; }

/* home */
.group { display: grid; gap: 6px; min-width: 0; }
.group > .label { padding: 0 2px; }
.lines { display: grid; background: var(--raised); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.line { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1.3fr) minmax(0, 1.5fr) minmax(0, 1fr) 118px; gap: 6px 14px; align-items: center; padding: 10px 14px; color: var(--fg); text-decoration: none; border-top: 1px solid var(--line); min-width: 0; }
.line:first-child { border-top: 0; }
.line:hover { background: var(--wait-soft); }
.line .who { display: grid; min-width: 0; }
.line .who b { font-weight: 550; overflow-wrap: anywhere; }
.line .who small { font: 12px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.line .num { font-size: 13px; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
.line .flag { justify-self: end; }
.segs { display: flex; gap: 2px; min-width: 0; }
.segs i { flex: 1; height: 6px; border-radius: 3px; background: var(--wait-soft); min-width: 2px; }
.segs i.merged { background: var(--ok); } .segs i.active { background: var(--accent); }
.segs i.stuck { background: var(--attn); } .segs i.blocked { background: var(--bad); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font: 500 12px var(--mono); background: var(--wait-soft); color: var(--wait); white-space: nowrap; }
.pill.active { background: var(--accent-soft); color: var(--accent); }
.pill.stuck { background: var(--attn-soft); color: var(--attn-ink); }
.pill.blocked { background: var(--bad-soft); color: var(--bad); }
.pill.merged { background: var(--ok-soft); color: var(--ok); }
.pill.phase { display: inline-flex; align-items: center; gap: 5px; margin-top: 3px; }
.pill.phase i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.phase.developing { background: var(--accent-soft); color: var(--accent); }
.pill.phase.testing { background: var(--attn-soft); color: var(--attn-ink); }
.pill.phase.slow { background: var(--bad-soft); color: var(--bad); }
.phases { display: flex; flex-wrap: wrap; gap: 4px; }
.estbar { margin: 8px 0; }
.estbar-track { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; }
.estbar i, .estbar-leg i { background: var(--muted); }
.estbar i.developing, .estbar-leg i.developing { background: var(--accent); }
.estbar i.testing, .estbar-leg i.testing { background: var(--attn-ink); }
.estbar i.reviewing, .estbar-leg i.reviewing { background: var(--ok, #2e8b57); }
.estbar-leg { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font-size: 12px; }
.estbar-leg span { display: inline-flex; align-items: center; gap: 5px; }
.estbar-leg i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.estbar small { display: block; margin-top: 4px; }
.pill.phase.waiting { background: var(--attn-soft); color: var(--attn-ink); }
.waitnote { margin: 6px 0; padding: 8px 12px; border-radius: 8px; background: var(--attn-soft); color: var(--attn-ink); font-size: 13px; line-height: 1.4; }
.who .waitnote { margin: 4px 0 0; padding: 4px 8px; font-size: 12px; }
.over { color: var(--attn-ink); font-weight: 600; }
.empty { padding: 12px 14px; color: var(--muted); font-size: 13px; background: var(--raised); border: 1px dashed var(--line); border-radius: 8px; }

/* plan screen */
.back { text-decoration: none; font-weight: 500; font-size: 13px; }
.phead { display: grid; gap: 4px; }
.phead .top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.phead h1 { font-size: 20px; font-weight: 650; overflow-wrap: anywhere; }
.numbers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.number { background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.number strong { font-size: 17px; line-height: 1.25; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.problem { border: 1px solid var(--attn); background: var(--attn-soft); border-radius: 7px; padding: 8px 12px; display: grid; gap: 4px; min-width: 0; }
.problem.crit { border-color: var(--bad); background: var(--bad-soft); }
.reason { font: 12.5px/1.45 var(--mono); overflow-wrap: anywhere; white-space: pre-wrap; }
.tabs { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--line); }
.tab { border-bottom: 2px solid transparent; padding: 6px 10px; margin-bottom: -1px; color: var(--muted); font-weight: 500; text-decoration: none; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab .count { font: 500 11px var(--mono); background: var(--attn-soft); color: var(--attn-ink); border-radius: 8px; padding: 0 6px; margin-left: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.swatch { display: inline-block; width: 16px; height: 8px; border-radius: 2px; }
.hatch { background: repeating-linear-gradient(135deg, var(--accent) 0 2px, transparent 2px 6px); }
.row, .axis { display: grid; grid-template-columns: 140px minmax(0, 1fr) 104px; gap: 10px; align-items: center; }
.row { width: 100%; border: 0; background: transparent; padding: 4px; text-align: left; border-radius: 5px; }
.row:hover { background: var(--wait-soft); }
.row[aria-pressed="true"] { background: var(--accent-soft); }
.job-cell { display: grid; min-width: 0; }
.job-cell .mono { font-weight: 500; overflow-wrap: anywhere; }
.job-cell small { font: 11.5px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.track { position: relative; height: 30px; border-left: 1px solid var(--line); min-width: 0; overflow: hidden; }
.bar { position: absolute; display: block; min-width: 3px; }
.bar.plan { top: 22px; height: 4px; border-radius: 2px; background: var(--wait); opacity: .55; }
.bar.real { top: 5px; height: 13px; border-radius: 3px; background: var(--accent); }
.bar.real.merged { background: var(--ok); } .bar.real.stuck { background: var(--attn); } .bar.real.blocked { background: var(--bad); }
.bar.fc { top: 5px; height: 13px; border-radius: 3px; }
.now-line { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--fg); }
.delta { text-align: right; font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--muted); }
.delta.late { color: var(--fg); font-weight: 600; }
.ticks { position: relative; height: 18px; font: 11px var(--mono); color: var(--muted); }
.ticks span { position: absolute; top: 2px; white-space: nowrap; }
.ticks .last { transform: translateX(-100%); }
.card { background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 10px; min-width: 0; }
.card-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 10px; align-items: baseline; }
.metrics { display: flex; flex-wrap: wrap; gap: 4px 16px; font: 12.5px var(--mono); color: var(--muted); }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; font-size: 13px; }
.facts ul { margin: 0; padding-left: 17px; }
.events { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font: 12.5px/1.45 var(--mono); color: var(--muted); }
.events li { overflow-wrap: anywhere; }
.raw { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12.5px/1.5 var(--mono); background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.plan-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 16px; background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.plan-facts div { display: grid; gap: 1px; align-content: start; min-width: 0; font-size: 13px; overflow-wrap: anywhere; }
.stale { color: var(--attn-ink); font-weight: 600; }

/* questions */
.q { display: grid; gap: 8px; }
.q .text { font-size: 14.5px; overflow-wrap: anywhere; white-space: pre-wrap; }
.q textarea { width: 100%; min-height: 70px; resize: vertical; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.q .actions { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--raised); border-radius: 6px; padding: 5px 12px; font-weight: 500; }
.btn:hover { background: var(--wait-soft); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--raised); }
.btn[disabled] { opacity: .55; cursor: default; }
.msg { font-size: 13px; overflow-wrap: anywhere; }
.msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); }
.qa { display: grid; gap: 2px; padding: 8px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
.qa:first-of-type { border-top: 0; }

/* plan versions */
.vpick { display: flex; align-items: center; gap: 8px; margin: 8px 0 0; font-size: 13px; }
.vchips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
.vchip { font: 500 12px var(--mono); padding: 1px 8px; border-radius: 10px; background: var(--wait-soft); color: var(--wait); }
.vchip.changed { background: var(--attn-soft, var(--wait-soft)); color: var(--attn-ink, var(--attn)); }
.vchip.added { background: var(--ok-soft); color: var(--ok); }
.vchip.removed { background: var(--bad-soft); color: var(--bad); }
#plan-diff pre.diff { margin: 4px 0 14px; font: 12.5px/1.5 var(--mono); overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; padding: 6px 0; background: var(--raised); }
#plan-diff .diff > div { padding: 0 12px; white-space: pre; min-height: 1.5em; }
.diff-add { background: var(--ok-soft); color: var(--ok); }
.diff-del { background: var(--bad-soft); color: var(--bad); }
.diff-hunk, .diff-file { color: var(--muted); }
/* spec and plan documents */
.docwrap { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 18px; align-items: start; }
.docidx { position: sticky; top: 12px; display: grid; gap: 2px; min-width: 0; }
.docidx .label { padding: 0 6px 4px; }
.idx { border: 0; background: transparent; text-align: left; padding: 4px 6px; border-radius: 5px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.idx:hover { background: var(--wait-soft); color: var(--fg); }
.docbody { background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 16px 20px; min-width: 0; display: grid; gap: 14px; }
.docbody > h1 { font-size: 19px; }
.sec { display: grid; gap: 6px; scroll-margin-top: 12px; min-width: 0; }
.sec > h2 { font-size: 16px; padding-top: 8px; border-top: 1px solid var(--line); }
.md { min-width: 0; overflow-wrap: anywhere; }
.md h3, .md h4, .md h5, .md h6 { font-size: 14.5px; margin: 12px 0 4px; }
.md p { margin: 6px 0; }
.md ul, .md ol { margin: 6px 0; padding-left: 22px; }
.md code { font: 12.5px var(--mono); background: var(--wait-soft); border-radius: 4px; padding: 0 4px; }
.md pre { margin: 8px 0; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
.md pre code { background: transparent; padding: 0; }
.md blockquote { margin: 8px 0; padding: 2px 12px; border-left: 3px solid var(--line); color: var(--muted); }
.md table { border-collapse: collapse; width: 100%; table-layout: fixed; margin: 8px 0; font-size: 13px; }
.md th, .md td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; overflow-wrap: anywhere; }
.md hr { border: 0; border-top: 1px solid var(--line); }
.md details { margin: 8px 0; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
.md details > summary { cursor: pointer; font-weight: 550; }
.md .dcards { list-style: none; padding: 0; display: grid; gap: 8px; }
.md li.dcard { list-style: none; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 6px; padding: 8px 12px; background: var(--bg); }
.md li.dcard .choice { margin: 0 0 4px; }
.md li.dcard dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 10px; font-size: 13px; }
.md li.dcard dt { color: var(--muted); font-weight: 600; }
.md li.dcard dd { margin: 0; }
.md .mmd-out { display: none; }

/* draft screen */
.dhead { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: flex-start; justify-content: space-between; }
.dhead .who { display: grid; gap: 2px; min-width: 0; }
.dhead h1 { font-size: 20px; font-weight: 650; overflow-wrap: anywhere; }
.dact { display: grid; gap: 4px; justify-items: end; max-width: 100%; min-width: 0; }
.dact .why { font-size: 12.5px; color: var(--muted); text-align: right; overflow-wrap: anywhere; }
.dact code { font: 12.5px var(--mono); overflow-wrap: anywhere; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; font-size: 12.5px; justify-self: start; }
.sec-head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; justify-content: space-between; padding-top: 8px; border-top: 1px solid var(--line); }
.sec-head h2 { font-size: 16px; overflow-wrap: anywhere; min-width: 0; }
.verdicts { display: flex; gap: 6px; }
.verdicts .btn[aria-pressed="true"][data-verdict="ok"] { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.verdicts .btn[aria-pressed="true"][data-verdict="change"] { background: var(--attn-soft); border-color: var(--attn); color: var(--attn-ink); }
.verdicts .btn[aria-pressed="true"][data-dv="ok"], .verdicts .btn[aria-pressed="true"][data-dv="none"] { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.verdicts .btn[aria-pressed="true"][data-dv="change"], .verdicts .btn[aria-pressed="true"][data-dv="fix"], .verdicts .btn[aria-pressed="true"][data-dv="more"] { background: var(--attn-soft); border-color: var(--attn); color: var(--attn-ink); }
.dv-more { margin-top: 4px; overflow-wrap: anywhere; }
.sec textarea { width: 100%; min-height: 54px; resize: vertical; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.sec .verdict { font: 500 12px var(--mono); }
.idx .mark { font: 11px var(--mono); margin-right: 4px; }
.idx .mark.ok { color: var(--ok); } .idx .mark.change { color: var(--attn-ink); }
.problems { margin: 0; padding-left: 18px; font: 12.5px/1.45 var(--mono); overflow-wrap: anywhere; }
.confirm { border: 1px solid var(--accent); }

/* history and Euklides */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters select, .filters input { border: 1px solid var(--line); background: var(--raised); border-radius: 6px; padding: 5px 8px; min-width: 0; }
.filters input { flex: 1 1 180px; }
.hrow { display: grid; grid-template-columns: 110px minmax(0, 2fr) 80px 50px minmax(0, 1.2fr) minmax(0, 1.2fr) 122px; gap: 6px 14px; align-items: center; padding: 9px 14px; border-top: 1px solid var(--line); color: var(--fg); text-decoration: none; font-size: 13px; font-variant-numeric: tabular-nums; min-width: 0; }
.hrow:first-child { border-top: 0; }
a.hrow:hover { background: var(--wait-soft); }
.hrow > span { min-width: 0; overflow-wrap: anywhere; }
.hrow.head { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--bg); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px 16px; }
.kv div { display: grid; gap: 1px; min-width: 0; overflow-wrap: anywhere; }
.kv strong { font-weight: 600; }
.decision { display: grid; gap: 4px; padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; overflow-wrap: anywhere; }
.decision:first-of-type { border-top: 0; }
.decision .top { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.toggles { display: grid; gap: 6px; }
.toggles label { display: flex; gap: 8px; align-items: center; }
.copyline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.copyline code { font: 13px var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; }

/* dashboard */
.dbar { display: grid; gap: 10px; background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; position: sticky; top: 0; z-index: 4; }
.dgroup { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; min-width: 0; }
.dgroup .label { min-width: 64px; }
.chip { border: 1px solid var(--line); background: var(--raised); border-radius: 999px; padding: 3px 11px; font-size: 13px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.dbar select, .dbar input[type="search"] { border: 1px solid var(--line); background: var(--raised); border-radius: 6px; padding: 4px 8px; min-width: 0; }
.dbar .reset { margin-left: auto; border: 0; background: none; color: var(--accent); font-weight: 600; }
.dbar .reset[disabled] { color: var(--muted); cursor: default; }
.dkpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.dkpi { background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; align-content: start; }
.dkpi strong { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.dkpi .dd { font-size: 12px; font-weight: 600; color: var(--muted); }
.dkpi .dd.up { color: var(--ok); } .dkpi .dd.down { color: var(--bad); }
.dgrid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; }
.dpanel { background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }

async function api(path, opts = {}) {
  const init = { cache: "no-store", method: opts.method || "GET", headers: { "X-Ark-Token": TOKEN } };
  if (opts.body !== undefined) {
    init.body = JSON.stringify(opts.body);
    init.headers["Content-Type"] = "application/json";
  }
  let r;
  try { r = await fetch(path, init); } catch (e) { return { ok: false, status: 0, body: { error: "cannot reach ark ui" } }; }
  try { return { ok: r.ok, status: r.status, body: await r.json() }; } catch (e) {
    return { ok: false, status: r.status, body: { error: r.ok ? "ark ui sent something unreadable" : `ark ui answered ${r.status}` } };
  }
}

// After each render: drop the graphs that left the page and mount every <canvas data-graph="repo/slug">.
function mountGraphs() {

    if (cv.dataset.mounted) return;
    cv.dataset.mounted = "1";
    const p = cv.dataset.src === "draft" ? { jobs: draftJobs() } : plans().find(x => keyOf(x) === cv.dataset.graph);
    mountGraph(cv, p, { mini: cv.dataset.mini === "1", still: cv.dataset.still === "1", unlit: cv.dataset.unlit === "1",

// the version picker, the per-job chips and the diff panel; nothing when the plan has fewer than two versions
function versionsBlock(p) {

  const chips = Object.entries(v.jobs || {}).map(([j, c]) => `<span class="vchip ${esc(c)}">${esc(j)} · ${esc(c)}</span>`).join("");
  return `<div class="vpick"><label for="plan-version">Compare</label><select id="plan-version" aria-label="Plan version">${opts}</select><span class="muted small">with v${last}</span></div>`
    + (chips ? `<div class="vchips">${chips}</div>` : "") + `<section id="plan-diff" class="sec"></section>`;
}
// fill the diff panel with textContent only: the plan is untrusted text
function paintDiff() {

async function loadVersions(from) {

function recentAlerts(p) {

function notices(p) {

const LEGEND = `<div class="legend"><span><i class="swatch" style="background:var(--ok)"></i>merged</span><span><i class="swatch" style="background:var(--accent)"></i>active</span><span><i class="swatch" style="background:var(--attn)"></i>waits for you</span><span><i class="swatch" style="background:var(--bad)"></i>blocked</span><span><i class="swatch" style="height:4px;background:var(--wait);opacity:.55"></i>budget</span><span><i class="swatch hatch"></i>≈ forecast</span><span><i class="swatch" style="width:2px;height:12px;background:var(--fg)"></i>now</span></div>`;
// The plan's constellation, the hero of the Timeline: a node opens the job. An approved plan that has not

const heroGraph = p => ((p.jobs || []).length ? `<div class="graph-box"><canvas class="graph" data-graph="${esc(keyOf(p))}" data-pick="1"${p.status === "waiting" ? ' data-unlit="1"' : ""} role="img" aria-label="Job graph of ${esc(p.title || p.slug)}: click a job to open it"></canvas></div>` : "");

  if (live && pts.length) pts.push(now);

  const t0 = Math.min(...pts), T = Math.max(Math.max(...pts) - t0, 60e3);

  }).join("");

    + (done.length ? `<div class="card"><span class="label">Answered</span>${doneHtml}</div>` : "");

async function sendAnswer(qid) {
  const p = currentPlan();
  if (!p) return;
  const k = `${keyOf(p)}#${qid}`;
  const a = S.answers[k] = S.answers[k] || { text: "" };
  if (!a.text.trim()) { Object.assign(a, { msg: "Write an answer first.", cls: "bad" }); render(true); return; }
  Object.assign(a, { busy: true, msg: "", cls: "" });
  render(true);
  const r = await api("/api/answer", { method: "POST", body: { repo: p.repo, slug: p.slug, id: qid, text: a.text.trim() } });
  a.busy = false;
  if (r.ok) Object.assign(a, { sent: true, msg: `Sent: ${r.body.text}. ark-loop applies it on its next beat.`, cls: "ok" });
  else if (r.status === 409 && r.body.kind === "closed") {
    const stored = r.body.answer || {};
    Object.assign(a, { sent: true, msg: `Already answered${stored.by ? ` by ${stored.by}` : ""}: ${stored.answer ?? ""}`, cls: "" });
  } else if (r.status === 403) Object.assign(a, { msg: "Reload the page: ark ui restarted", cls: "bad" });
  else Object.assign(a, { msg: r.body.error || `ark ui answered ${r.status}`, cls: "bad" });
  render(true);
  poll();
}

const DASH_COLOR = { done: "var(--ok)", running: "var(--accent)", waiting: "var(--line)", held: "var(--attn)", blocked: "var(--bad)", aborted: "var(--muted)" };
function dashSpendChart(days, period) {
  const W = 640, H = 170, LM = 38, B = 22, T = 8, max = Math.max(1, ...days.map(d => d.usd));
  const nice = max <= 5 ? Math.ceil(max) : Math.ceil(max / 5) * 5, bw = (W - LM) / days.length;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Spend per day">`;
  [0, .5, 1].forEach(fr => {
    const y = T + (H - B - T) * (1 - fr);
    s += `<line x1="${LM}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${LM - 6}" y="${y + 4}" text-anchor="end">$${esc((nice * fr).toFixed(nice < 6 ? 1 : 0))}</text>`;
  });
  days.forEach((d, i) => {
    const h = (H - B - T) * d.usd / nice, dt = new Date(d.t);
    s += `<rect x="${(LM + i * bw + bw * .15).toFixed(1)}" y="${(H - B - h).toFixed(1)}" width="${(bw * .7).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="var(--accent)"><title>${esc(`${dt.toLocaleDateString([], { month: "short", day: "numeric" })}: ${usdText(d.usd)}`)}</title></rect>`;
  });
  const step = period <= 7 ? 1 : period <= 14 ? 2 : 5;
  for (let i = days.length - 1; i >= 0; i -= step) {
    const dt = new Date(days[i].t);
    s += `<text x="${(LM + i * bw + bw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${dt.getDate()}/${dt.getMonth() + 1}</text>`;
  }
  return s + "</svg>";
}
function dashHbars(entries) {
  const max = Math.max(.0001, ...entries.map(e => e[1]));
  return entries.length ? entries.map(([k, v]) => `<div class="dhbar"><span>${esc(k)}</span><div class="dtrack"><span style="width:${(v / max * 100).toFixed(1)}%"></span></div><span class="mono" style="text-align:right">${esc(usdText(v))}</span></div>`).join("") : '<div class="empty">No spend in this view.</div>';
}

      window.focus();
      if (n.url) window.open(n.url, "_blank", "noopener"); else if (n.plan) window.openPlan(n.plan);

  }
  if (s === "history" || (s === "plan" && !currentPlan())) {
    const r = await api("/api/history");
    if (r.ok && Array.isArray(r.body)) { S.history = r.body; render(); }
  }
  if (s === "draft" && !S.draft) await loadDraft();
  if (s === "plan" && currentPlan()) await loadVersions(S.ver && S.ver.key === keyOf(currentPlan()) && S.ver.data.diff ? S.ver.data.diff.from : null);
  if (s === "plan" && S.route.tab === "decisions") await loadDecisions();
  if (s === "euklides") {
    const r = await api("/api/euklides");
    if (r.ok && r.body && typeof r.body === "object") { S.euk = r.body; render(); }
  }
}
S.route = parseRoute(location.hash);
document.body.dataset.screen = S.route.screen;
setMotion(moving());
setTitle();
poll();
load();
setInterval(() => { poll(); load(); }, 10000);
</script>
</body>
</html>
